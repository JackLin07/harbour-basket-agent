[project]
name = "harbour-basket-agent"
version = "0.1.0"
description = "Weekend portfolio scaffold: a hand-written grocery shopping assistant agent over synthetic Australian supermarket data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harbour Basket Demo" }]
keywords = ["agent", "rag", "mcp", "evals", "portfolio"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
rag = ["sentence-transformers>=3.0"]
mcp = ["mcp[cli]>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
    "harbour-basket-agent[llm,rag,mcp,dev]",
]

[project.scripts]
harbour-basket = "shopping_agent.cli:main"
harbour-basket-eval = "shopping_agent.evals.runner:main"
harbour-basket-mcp = "shopping_agent.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "agent: tests that require the weekend agent implementation",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
