name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest

  eval:
    # Optional: later steps run only when an API key is present as a repo secret.
    # Presence is checked at step level (job-level if cannot use secrets).
    # Safe to skip on a fork or before you add a key.
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$XAI_API_KEY" ] || [ -n "$AZURE_OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$OPENAI_API_KEY" ] && [ -n "$XAI_API_KEY" ]; then
            echo "llm_provider=xai" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.has_key == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.has_key == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.keys.outputs.has_key == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"
      - name: Run evals
        if: steps.keys.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LLM_PROVIDER: ${{ steps.keys.outputs.llm_provider }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m shopping_agent.evals.runner --agent real
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.has_key == 'true'
        with:
          name: eval-results
          path: evals/results/
